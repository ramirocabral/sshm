[package]
name = "sshm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "SSH session manager for the terminal"

[dependencies]
aes = "0.9.4"
age = "0.12"
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.23.1"
blowfish = "0.10.0"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste", "osc52"] }
csv = "1.4.0"
des = "0.9.0"
futures = "0.3.34"
md-5 = "0.11.0"
nucleo = "0.5"
portable-pty = "0.9"
rand = "0.10.4"
ratatui = "0.30"
russh-sftp = "3"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
